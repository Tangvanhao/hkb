    <!-- STREAMING_CHUNK:Styling the layout... -->
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --success: #10b981;
        --success-bg: #d1fae5;
        --danger: #ef4444;
        --danger-bg: #fee2e2;
        --bg-color: #f3f4f6;
        --text-main: #1f2937;
        --text-muted: #6b7280;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .app-container {
        width: 100%;
        max-width: 900px;
        height: 85vh;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        margin: 20px;
      }

      .header {
        background: var(--primary);
        color: white;
        padding: 20px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.2em;
        font-weight: 600;
      }

      .score-badge {
        background: rgba(255, 255, 255, 0.2);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.9em;
      }

      #slides-container {
        flex: 1;
        position: relative;
        overflow-y: auto;
        padding: 40px;
      }

      /* STREAMING_CHUNK:Styling slides and options... */
      .slide {
        display: none;
        flex-direction: column;
        animation: slideIn 0.4s ease-out forwards;
      }

      .slide.active {
        display: flex;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .question {
        font-size: 1.4em;
        color: var(--text-main);
        margin-bottom: 30px;
        font-weight: 600;
        line-height: 1.5;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .option {
        background-color: #f8fafc;
        padding: 16px 24px;
        border-radius: 10px;
        border: 2px solid #e2e8f0;
        cursor: pointer;
        font-size: 1.1em;
        color: var(--text-main);
        transition: all 0.2s ease;
        display: flex;
        align-items: flex-start;
      }

      .option:hover:not(.disabled) {
        border-color: var(--primary);
        background-color: #eff6ff;
        transform: translateY(-2px);
      }

      .option .prefix {
        font-weight: bold;
        margin-right: 15px;
        color: var(--primary);
        min-width: 25px;
      }

      /* States for answers */
      .option.disabled {
        cursor: default;
        pointer-events: none;
      }

      .option.correct {
        background-color: var(--success-bg);
        border-color: var(--success);
        color: #065f46;
      }

      .option.correct .prefix {
        color: var(--success);
      }

      .option.wrong {
        background-color: var(--danger-bg);
        border-color: var(--danger);
        color: #991b1b;
      }

      .option.wrong .prefix {
        color: var(--danger);
      }

      .option.faded {
        opacity: 0.5;
      }

      /* STREAMING_CHUNK:Styling controls... */
      .controls {
        padding: 20px 30px;
        background: #f8fafc;
        border-top: 1px solid #e2e8f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      button {
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 1em;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.3s,
          opacity 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button:hover:not(:disabled) {
        background-color: var(--primary-hover);
      }

      button:disabled {
        background-color: var(--text-muted);
        opacity: 0.5;
        cursor: not-allowed;
      }

      .progress-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }

      .progress-text {
        font-weight: 600;
        color: var(--text-main);
      }

      .progress-bar-bg {
        width: 150px;
        height: 6px;
        background: #e2e8f0;
        border-radius: 3px;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        background: var(--primary);
        width: 0%;
        transition: width 0.3s ease;
      }
    </style>
  </head>

      /* STREAMING_CHUNK:Initializing state and UI... */
      let currentSlideIndex = 0;
      let score = 0;
      const answeredQuestions = new Set();
      const slidesContainer = document.getElementById("slides-container");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progressText = document.getElementById("progress-text");
      const progressBar = document.getElementById("progress-bar");
      const scoreDisplay = document.getElementById("score");

      function initQuiz() {
        questionsData.forEach((qData, index) => {
          const slideDiv = document.createElement("div");
          slideDiv.className = `slide ${index === 0 ? "active" : ""}`;
          slideDiv.id = `slide-${index}`;

          let optionsHtml = "";
          qData.opt.forEach((opt, optIndex) => {
            optionsHtml += `
                    <div class="option" id="opt-${index}-${optIndex}" onclick="checkAnswer(${index}, ${optIndex}, ${opt.c})">
                        <span class="prefix">${opt.p}.</span>
                        <span class="text">${opt.t}</span>
                    </div>
                `;
          });

          slideDiv.innerHTML = `
                <div class="question">${qData.q}</div>
                <div class="options">
                    ${optionsHtml}
                </div>
            `;

          slidesContainer.appendChild(slideDiv);
        });
        updateControls();
      }

      /* STREAMING_CHUNK:Handling interactions... */
      function checkAnswer(slideIndex, optIndex, isCorrect) {
        // Prevent answering multiple times on the same question
        if (answeredQuestions.has(slideIndex)) return;

        answeredQuestions.add(slideIndex);

        const slide = document.getElementById(`slide-${slideIndex}`);
        const clickedOption = document.getElementById(
          `opt-${slideIndex}-${optIndex}`,
        );
        const allOptions = slide.querySelectorAll(".option");

        // Disable all options visually
        allOptions.forEach((opt) => opt.classList.add("disabled"));

        if (isCorrect) {
          clickedOption.classList.add("correct");
          score++;
          scoreDisplay.innerText = score;
        } else {
          clickedOption.classList.add("wrong");
          // Find and highlight the correct one
          questionsData[slideIndex].opt.forEach((opt, idx) => {
            if (opt.c) {
              document
                .getElementById(`opt-${slideIndex}-${idx}`)
                .classList.add("correct");
            } else if (idx !== optIndex) {
              document
                .getElementById(`opt-${slideIndex}-${idx}`)
                .classList.add("faded");
            }
          });
        }
      }

      function showSlide(index) {
        const slides = document.querySelectorAll(".slide");
        slides.forEach((s) => s.classList.remove("active"));
        slides[index].classList.add("active");
        currentSlideIndex = index;
        updateControls();

        // Auto scroll to top of question
        slidesContainer.scrollTo({ top: 0, behavior: "smooth" });
      }

      function nextSlide() {
        if (currentSlideIndex < questionsData.length - 1) {
          showSlide(currentSlideIndex + 1);
        }
      }

      function prevSlide() {
        if (currentSlideIndex > 0) {
          showSlide(currentSlideIndex - 1);
        }
      }

      function updateControls() {
        prevBtn.disabled = currentSlideIndex === 0;
        nextBtn.disabled = currentSlideIndex === questionsData.length - 1;
        progressText.innerText = `${currentSlideIndex + 1} / ${questionsData.length}`;
        progressBar.style.width = `${((currentSlideIndex + 1) / questionsData.length) * 100}%`;
      }

      // Keyboard support
      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowRight") {
          nextSlide();
        } else if (event.key === "ArrowLeft") {
          prevSlide();
        }
      });

      // Run initialization
      initQuiz();
    </script>
